name: Build OnePlus Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب الكود المصدري
        run: |
          git clone https://github.com/OnePlusOSS/android_kernel_oneplus_sm4350.git kernel_source

      - name: 2. تثبيت الأدوات الأساسية
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison

      - name: 3. بناء الكيرنل
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # البحث عن ملف الـ config داخل مجلد الكود الذي حملناه
          CONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          make $(basename $CONFIG)
          make -j$(nproc)

      - name: 4. حفظ النتيجة
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel_source/arch/arm64/boot/Image.gz-dtb
