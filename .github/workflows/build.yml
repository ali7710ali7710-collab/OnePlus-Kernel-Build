name: Ultra-Safe OnePlus Kernel Build (Final)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      KBUILD_OUTPUT: out
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: 2. Install Build Dependencies (Python3 only)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison bc \
          libssl-dev libcrypto++-dev libncurses-dev libelf-dev python3 python3-minimal python3-venv
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: 3. Fix Python 2 Syntax Errors for Python 3
        run: |
          cd kernel_source
          find . -name "*.py" -exec sed -i 's/print \([^()]*\)/print(\1)/g' {} +

      - name: 4. Redirect python2 calls to python3 (if compatible)
        run: sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true

      # 4️⃣ Ensure Techpack files exist
      - name: Verify Techpack files
        run: |
          mkdir -p kernel_source/techpack/oneplus/config
          touch kernel_source/techpack/oneplus/config/oneplus.h
          touch kernel_source/techpack/oneplus/config/coretech.h
          cp kernel_source/techpack/oneplus/config/defconfig kernel_source/$KBUILD_OUTPUT/.config || true

      # 5️⃣ Build objtool first
      - name: Build objtool
        working-directory: kernel_source/tools/objtool
        run: make -j$(nproc)

      # 6️⃣ Prepare kernel
      - name: Prepare kernel source
        working-directory: kernel_source
        run: |
          make mrproper
          rm -rf $KBUILD_OUTPUT
          mkdir -p $KBUILD_OUTPUT
          # Fix invalid 'm' options
          sed -i 's/^\(.*\)=m$/\1=y/' $KBUILD_OUTPUT/.config || true
          make O=$KBUILD_OUTPUT ARCH=$ARCH olddefconfig

      # 7️⃣ Build kernel
      - name: Build kernel
        working-directory: kernel_source
        run: |
          make -j$(nproc) O=$KBUILD_OUTPUT ARCH=$ARCH \
            CC="ccache gcc" \
            HOSTCC="gcc" \
            KBUILD_VERBOSE=1 \
            LOCALVERSION=-oneplus \
            V=1

      # 8️⃣ Build dtb and modules
      - name: Build dtb and modules
        working-directory: kernel_source
        run: |
          make O=$KBUILD_OUTPUT ARCH=$ARCH dtbs modules

      # 9️⃣ Upload kernel image
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel_source/$KBUILD_OUTPUT/arch/arm64/boot/Image.gz-dtb

      # 🔟 Upload build warnings log
      - name: Upload build warnings log
        uses: actions/upload-artifact@v4
        with:
          name: Build-Warnings-Log
          path: kernel_source/$KBUILD_OUTPUT/*.log
