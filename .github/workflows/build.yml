name: Build OnePlus Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب الكود المصدري
        run: |
          git clone https://github.com/OnePlusOSS/android_kernel_oneplus_sm4350.git kernel_source
          ls -R kernel_source | grep "defconfig"  # هذا السطر سيخبرنا أين يوجد الملف بالضبط

      - name: 2. تثبيت الأدوات
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison bc libssl-dev

      - name: 3. بناء الكيرنل (بدون تعديلات مؤقتة)
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # سنبني باستخدام ملف الـ defconfig الافتراضي الموجود في المجلد
          make vendor/dre_defconfig
          make -j$(nproc)

      - name: 4. حفظ النتيجة
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel_source/arch/arm64/boot/Image.gz-dtb
