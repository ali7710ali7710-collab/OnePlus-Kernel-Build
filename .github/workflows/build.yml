name: Build OnePlus Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب الكود المصدري
        uses: actions/checkout@v4

      - name: 2. إعداد البيئة وتثبيت Python2
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison
          curl https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz -o python2.tgz
          tar -xf python2.tgz
          cd Python-2.7.18 && ./configure && make -j$(nproc) && sudo make install
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python

      - name: 3. العثور على ملف الإعداد وتعديله
        run: |
          # البحث عن ملف الـ defconfig الصحيح داخل المستودع
          CONFIG_FILE=$(find . -name "*defconfig" | grep "dre_defconfig" | head -n 1)
          echo "Found config at: $CONFIG_FILE"
          
          # تطبيق التعديلات
          echo "CONFIG_CFG80211_INTERNAL_REGDB=y" >> $CONFIG_FILE
          echo "CONFIG_NL80211_TESTMODE=y" >> $CONFIG_FILE
          echo "CONFIG_MAC80211_DEBUGFS=y" >> $CONFIG_FILE

      - name: 4. بناء الكيرنل
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # استخراج اسم المجلد الصحيح للإعداد
          CONFIG_NAME=$(basename $(find . -name "*dre_defconfig*"))
          make $CONFIG_NAME
          make -j$(nproc)

      - name: 5. حفظ النتيجة
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: arch/arm64/boot/Image.gz-dtb
