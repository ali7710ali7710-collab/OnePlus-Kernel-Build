name: Final Optimized Kernel Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # استخدام حاوية Ubuntu 20.04 لضمان توافق Python 2 و أدوات البناء القديمة
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 1. Install Dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential gcc-aarch64-linux-gnu flex bison bc \
          libssl-dev libncurses-dev libelf-dev python python3
          
      - name: 2. Clone Kernel Source
        run: git clone https://github.com/OnePlusOSS/android_kernel_oneplus_sm4350.git kernel_source

      - name: 3. Configure Python Environment
        run: |
          # التأكد من أن أمر python يشير إلى Python 2.7
          ln -sf /usr/bin/python2.7 /usr/bin/python
          python --version
          python3 --version

      - name: 4. Build Kernel (GCC-9 & Force Bash)
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. تثبيت إصدار قديم متوافق مع النواة
          apt-get install -y gcc-9 g++-9
          export CC=gcc-9
          
          # 2. إعداد المسارات لـ GCC-9
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100
          
          # 3. إعداد البيئة
          CONFIG_NAME=$(basename $(find arch/arm64/configs -name "*defconfig*" | head -n 1))
          make $CONFIG_NAME
          
          # 4. البناء مع تعطيل تحويل التحذيرات لأخطاء (-Wno-error) 
          # واستخدام bash صريحاً لتجنب خطأ Bad substitution
          make -j$(nproc) SHELL=/bin/bash KBUILD_CFLAGS="-Wno-error" Image.gz-dtb


          
      - name: 5. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final-Build-Kernel
          path: kernel_source/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
