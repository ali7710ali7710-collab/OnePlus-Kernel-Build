name: Raw OnePlus Kernel Build (With Python Fixes)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clone Kernel Source
        run: git clone https://github.com/OnePlusOSS/android_kernel_oneplus_sm4350.git kernel_source

      - name: 2. Install Dependencies & Python Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison bc \
          libssl-dev libcrypto++-dev libncurses-dev libelf-dev python3 python3-minimal python3-venv
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: 3. Fix Python 3 Incompatibility and Remove GCC-Wrapper
        run: |
          cd kernel_source
          find . -name "*.py" -exec sed -i 's/print \([^()]*\)/print(\1)/g' {} +
          if [ -f "scripts/gcc-wrapper.py" ]; then
            rm scripts/gcc-wrapper.py
            sed -i 's/scripts\/gcc-wrapper.py//g' Makefile || true
            echo "GCC-Wrapper removed successfully."
          fi

      - name: 4. Redirect python2 calls to python3
        run: sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true

      - name: 5. Raw Kernel Build
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # استخراج اسم الديف كونفيج المتاح
          CONFIG_NAME=$(basename $(find arch/arm64/configs -name "*defconfig*" | head -n 1))
          
          # البناء الخام المباشر
          make $CONFIG_NAME
          make -j$(nproc) Image.gz-dtb

      - name: 6. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Raw-Kernel-Image
          path: kernel_source/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: warn
