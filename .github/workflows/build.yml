name: Build OnePlus Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب الكود
        uses: actions/checkout@v4

      - name: 2. إعداد البيئة (Python3 Compatibility)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison bc libssl-dev
          # إنشاء رابط يخدع الكيرنل بجعل أمر python يشير لـ python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: 3. بناء الكيرنل
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # البحث عن ملف الـ defconfig وتعديله
          CONFIG_FILE=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          # إضافة إعدادات الشبكة والقنوات
          echo "CONFIG_CFG80211_INTERNAL_REGDB=y" >> $CONFIG_FILE
          echo "CONFIG_NL80211_TESTMODE=y" >> $CONFIG_FILE
          # بدء البناء
          make $(basename $CONFIG_FILE)
          make -j$(nproc)

      - name: 4. حفظ النتيجة
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: arch/arm64/boot/Image.gz-dtb
