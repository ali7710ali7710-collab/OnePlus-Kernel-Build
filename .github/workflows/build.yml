name: Build OnePlus Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب الكود
        run: git clone https://github.com/OnePlusOSS/android_kernel_oneplus_sm4350.git kernel_source

      - name: 2. استكشاف المسارات الصحيحة (مهم جداً)
        run: |
          cd kernel_source
          echo "--- قائمة ملفات الإعدادات الموجودة ---"
          find arch/arm64/configs -name "*defconfig*"
          echo "--- انتهاء القائمة ---"

      - name: 3. البناء التلقائي
        run: |
          cd kernel_source
          # البحث عن أول ملف defconfig وإسناده لمتغير
          CONFIG=$(find arch/arm64/configs -name "*defconfig*" | head -n 1)
          CONFIG_NAME=$(basename $CONFIG)
          echo "تم اختيار ملف الإعداد: $CONFIG_NAME"
          
          # تثبيت الأدوات الضرورية في نفس الخطوة
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison bc libssl-dev
          
          # البناء
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make $CONFIG_NAME
          make -j$(nproc)
