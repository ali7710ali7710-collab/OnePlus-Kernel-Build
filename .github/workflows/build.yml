name: Build OnePlus Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب الكود المصدري
        uses: actions/checkout@v4

      - name: 2. تثبيت الأدوات الأساسية
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison

      - name: 3. بناء الكيرنل (الافتراضي)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # البحث عن أي ملف defconfig داخل المجلد
          CONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          make $(basename $CONFIG)
          make -j$(nproc)

      - name: 4. حفظ النتيجة
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: arch/arm64/boot/Image.gz-dtb
