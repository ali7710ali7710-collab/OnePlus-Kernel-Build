name: Build OnePlus Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب الكود المصدري
        run: |
          git clone https://github.com/OnePlusOSS/android_kernel_oneplus_sm4350.git kernel_source
          
      - name: 2. تثبيت الأدوات ودعم Python2
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential flex bison software-properties-common
          # إضافة مستودع deadsnakes للحصول على python2
          sudo add-apt-repository ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python2.7
          # ربط python بـ python2.7
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          
      - name: 3. تعديل إعدادات الشبكة
        run: |
          cd kernel_source
          echo "CONFIG_WLAN=y" >> arch/arm64/configs/vendor/dre_defconfig
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/vendor/dre_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/vendor/dre_defconfig
          echo "CONFIG_MAC80211_MESH=y" >> arch/arm64/configs/vendor/dre_defconfig
          echo "CONFIG_CFG80211_INTERNAL_REGDB=y" >> arch/arm64/configs/vendor/dre_defconfig
          
      - name: 4. بناء الكيرنل
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make vendor/dre_defconfig
          make -j$(nproc)
          
      - name: 5. حفظ ملف النتيجة
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel_source/arch/arm64/boot/Image.gz-dtb
